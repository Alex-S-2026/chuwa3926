# Override main MySQL settings so @SpringBootTest runs without a real database (CI / local).
spring.datasource.url=jdbc:h2:mem:redbook_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Required by security / JWT beans (mirrors main application.properties).
app.jwt-secret=JWTSecretKey
app.jwt-expiration-milliseconds=604800000
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
